name: Decision
description: A choice that needs an ADR in docs/decisions/
labels: ["type:decision"]
body:
  - type: input
    id: adr
    attributes:
      label: ADR file
      placeholder: docs/decisions/0001-backend-stack.md
    validations:
      required: true
  - type: input
    id: decider
    attributes:
      label: Decider
      description: The person who marks the ADR Accepted.
      placeholder: "@backend-lead"
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and evidence
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] ADR status is Accepted, with the decision and consequences filled in
        - [ ] Affected areas notified with their labels
    validations:
      required: true
