name: Spike
description: Time-boxed investigation that answers one question
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: 2 hours
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when (acceptance criteria)
      value: |
        - [ ] Answer written as a comment, with evidence (commands, screenshots, links)
        - [ ] Decision or fallback recorded (ADR or docs/RISKS.md)
    validations:
      required: true
  - type: textarea
    id: fallback
    attributes:
      label: Fallback if the answer is no
