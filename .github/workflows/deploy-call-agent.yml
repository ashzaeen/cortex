# Manual deploy of the FaceTime call agent (apps/call-agent/agent) to the Railway service `call-agent`.
# Run it from Actions -> deploy-call-agent -> Run workflow. It never runs on a push, because redeploying the
# agent ends any call in progress. Uses the same RAILWAY_TOKEN project token (cortex-api / production) as the
# backend deploy in ci.yml, and the same concurrency group, so deploys queue and never overlap.
#
# `ref` is the commit, branch or tag to deploy. The default is main. To roll back, run it again with the commit
# that was deployed before (the agent code at that commit is what ships).
name: deploy-call-agent

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to deploy (default main; give an older commit to roll back)"
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Require the Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set, so nothing was deployed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the agent before shipping it
        working-directory: apps/call-agent/agent
        run: node --test cortex.test.mjs
      - name: Deploy to Railway
        working-directory: apps/call-agent/agent
        run: |
          echo "Deploying $(git rev-parse --short HEAD) to the call-agent service"
          npm install -g @railway/cli@5.71.0
          railway up --ci --service call-agent --environment production
