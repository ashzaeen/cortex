[project]
name = "cortex-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"core/skill_mock.py" = ["E501"]
"core/skill_prompts.py" = ["E501"]
"skills/skills_ask.py" = ["E501"]
"skills/registry.py" = ["E501"]
"skills/people_search.py" = ["E501"]
"tests/test_skills.py" = ["E501"]
