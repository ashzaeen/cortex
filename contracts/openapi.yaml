openapi: 3.1.0
info:
  title: Cortex API
  version: 0.1.0-proposed
  description: |
    Status: PROPOSED. Draft contract between capture, backend, dashboard and call agent.
    The contract owner (@ashzaeen) may change it through the contract-change process in AGENTS.md.
    Entity schemas live in ./schemas and are the single source of truth.
    Mock it with `make mock` (Prism, port 4010).
x-examples:
  # Shared example entities, reused below via YAML aliases (*Name). Mock responses use them.
  AshIntroMoment: &AshIntroMoment
    id: mom_live_001
    ts: "2026-11-15T14:02:11-06:00"
    source: glasses
    mode: focus
    transcript: "This is Ash from Acme."
    caption: "A person in a blue jacket at a booth with an Acme banner."
    snapshot_url: "fixtures/snapshots/placeholder-booth.svg"
    place: "HackUTA expo hall"
    person_ids: [per_ash]
    off_record: false
  AshPromiseMoment: &AshPromiseMoment
    id: mom_live_002
    ts: "2026-11-15T14:02:40-06:00"
    source: glasses
    mode: focus
    transcript: "I'll send you the deck Friday."
    caption: "Ash holding a phone, Acme banner behind them."
    snapshot_url: "fixtures/snapshots/placeholder-booth.svg"
    place: "HackUTA expo hall"
    person_ids: [per_ash]
    off_record: false
  Ash: &Ash
    id: per_ash
    name: Ash
    company: Acme
    role: null
    consent: introduction
    introduced_moment_id: mom_live_001
    topics: [Q4 launch]
    notes: null
    name_confidence: 0.95
  AshPromise: &AshPromise
    id: prm_live_001
    direction: waiting_on
    person_id: per_ash
    what: "Send the deck"
    due: { date: "2026-11-20", inferred: false, text: "Friday" }
    status: confirmed
    source_moment_id: mom_live_002
  FollowUp: &FollowUp
    id: act_live_001
    type: follow_up_email
    status: sent
    person_id: per_ash
    draft:
      to: "ash@acme.example"
      subject: "Great meeting you at HackUTA"
      body: "Hi Ash, great to meet you today. Looking forward to the deck on Friday."
    source_moment_ids: [mom_live_001, mom_live_002]
  FollowUpReceipt: &FollowUpReceipt
    id: rcp_act_001
    kind: action
    created_at: "2026-11-15T14:05:30-06:00"
    summary: "Sent follow-up email to Ash (Acme)."
    action_id: act_live_001
    source_moment_ids: [mom_live_001, mom_live_002]
    undo: { available: true, until: "2026-11-15T14:06:00-06:00" }
# Private memory: with CORTEX_API_KEY set on the backend, every operation except GET /health needs
# the key (X-Cortex-Key, or Authorization: Bearer) and answers 401 unauthorized without it. Unset
# (local dev, the mock) it is open. Browsers never hold the key: the dashboard proxy adds it.
# Per-user memory: X-Cortex-User (an email) picks whose memory a request reads and writes. Each user
# starts with their own copy of the demo profile; nothing one user adds reaches another. No header =
# the shared default memory, which every signed-in user also sees (its test fixtures excepted). The
# dashboard proxy sends the signed-in email; the glasses app and call agent send the wearer's.
security:
  - {}
  - cortexKey: []
servers:
  - url: http://localhost:4010
    description: Prism mock (make mock / make dev)
  - url: http://localhost:8000
    description: Local backend (port TBD by the backend lead)
tags:
  - name: moments
  - name: ask
  - name: people
  - name: promises
  - name: actions
  - name: receipts
  - name: privacy
  - name: modes
  - name: calls
  - name: lists
  - name: events
  - name: health
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      security: []
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }

  /moments:
    post:
      tags: [moments]
      operationId: ingestMoment
      summary: Ingest a moment from glasses, phone, call or dashboard (D-1)
      description: |
        One ingest pipeline for every capture source. The backend transcribes, captions and
        stores the moment, links people by introduction, detects promises, and emits
        moment.created (plus person.created / promise.proposed) on /events.
        Returns 409 if capture is paused or off-the-record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MomentIngest" }
            example:
              ts: "2026-11-15T14:02:11-06:00"
              source: glasses
              transcript: "This is Ash from Acme."
              snapshot_base64: null
      responses:
        "201":
          description: Stored moment
          content:
            application/json:
              schema: { $ref: "./schemas/moment.schema.json" }
              example: *AshIntroMoment
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [moments]
      operationId: listMoments
      summary: Timeline, newest first
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: tag, in: query, description: "Only moments with this tag, e.g. decision (FOC-5 decision log).", schema: { type: string } }
      responses:
        "200":
          description: Moments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "./schemas/moment.schema.json" } }
              example:
                items:
                  - *AshPromiseMoment
                  - *AshIntroMoment

  /moments/search:
    get:
      tags: [moments]
      operationId: searchMoments
      summary: Search memory; always returns the source moments (D-2)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [moment, score]
                      properties:
                        moment: { $ref: "./schemas/moment.schema.json" }
                        score: { type: number }
              example:
                results:
                  - moment: *AshPromiseMoment
                    score: 0.91

  /moments/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [moments]
      operationId: getMoment
      summary: One moment, for replaying it with its snapshot (MEM-10)
      responses:
        "200":
          description: Moment
          content:
            application/json:
              schema: { $ref: "./schemas/moment.schema.json" }
              example: *AshPromiseMoment
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [privacy]
      operationId: deleteMoment
      summary: Delete a moment and everything derived from it (D-9)
      responses:
        "200":
          description: Deletion receipt
          content:
            application/json:
              schema: { $ref: "./schemas/receipt.schema.json" }
              example:
                id: rcp_del_001
                kind: deletion
                created_at: "2026-11-15T14:09:00-06:00"
                summary: "Deleted 1 moment and its transcript, caption, snapshot and embedding."
                action_id: null
                source_moment_ids: []
                undo: { available: false, until: null }
        "404": { $ref: "#/components/responses/Error" }

  /ask:
    post:
      tags: [ask]
      operationId: ask
      summary: Answer a question from memory with proof (D-5)
      description: Answers only from retrieved moments. If nothing supports an answer, grounded is false and the answer says so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, channel]
              properties:
                question: { type: string, minLength: 1 }
                channel: { type: string, enum: [voice, dashboard, call] }
            example: { question: "What did Ash promise me?", channel: voice }
      responses:
        "200":
          description: Answer with sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskAnswer" }
              example:
                answer: "Ash from Acme promised to send you the deck by Friday, Nov 20."
                spoken: "Ash promised to send you the deck by Friday."
                grounded: true
                sources:
                  - *AshPromiseMoment
                receipt_id: rcp_ask_001

  /digest:
    get:
      tags: [ask]
      operationId: getDigest
      summary: Daily digest, people met, promises, follow-ups and list items for one day (MEM-9)
      description: Built only from that day's stored records. /ask answers "what did I do today?" with the same digest.
      parameters:
        - name: date
          in: query
          description: "YYYY-MM-DD in the user's timezone; default today."
          schema: { type: string, format: date }
      responses:
        "200":
          description: Digest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Digest" }
              example:
                date: "2026-11-15"
                spoken: "Today you captured 2 moments across focus mode. Met Ash from Acme. Ash promised to send the deck by Friday, Nov 20."
                bullets: ["Met Ash from Acme", "Ash promised to send the deck by Friday, Nov 20"]
                moment_count: 2
                people: [*Ash]
                promises: [*AshPromise]
                actions: [*FollowUp]
                source_moment_ids: [mom_live_001, mom_live_002]
        "400": { $ref: "#/components/responses/Error" }

  /rewind:
    get:
      tags: [ask]
      operationId: rewind
      summary: Replay the exact transcript line that answers a question, with its moment and snapshot (MEM-10)
      description: The line is copied from the stored transcript, never paraphrased. found is false when nothing matches. /ask routes "rewind", "replay" and "word for word" questions here.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          example: "Rewind what Ash promised me"
      responses:
        "200":
          description: Rewind
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rewind" }
              example:
                found: true
                moment: *AshPromiseMoment
                line: "I'll send you the deck Friday."
                spoken: "Today at 2:02 PM, with Ash: 'I'll send you the deck Friday.'"

  /people:
    get:
      tags: [people]
      operationId: listPeople
      summary: Contact cards
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "./schemas/person.schema.json" } }
              example:
                items:
                  - *Ash
    post:
      tags: [people]
      operationId: createPerson
      summary: Create a contact card from an introduction (D-3)
      description: Usually created by the backend during ingest; this endpoint lets the dashboard add or correct a person by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, introduced_moment_id]
              properties:
                name: { type: string, minLength: 1 }
                company: { type: [string, "null"] }
                introduced_moment_id: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "./schemas/person.schema.json" }
              example: *Ash

  /people/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [people]
      operationId: updatePerson
      summary: Edit a contact card by hand (MEM-4); only the fields sent change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1 }
                company: { type: [string, "null"] }
                role: { type: [string, "null"] }
                notes: { type: [string, "null"] }
                topics: { type: array, items: { type: string } }
            example: { company: "Acme Robotics" }
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema: { $ref: "./schemas/person.schema.json" }
              example: *Ash
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [privacy]
      operationId: deletePerson
      summary: Delete a contact card, its promises and proposed actions, and its links on moments (MEM-4)
      description: The moments stay; delete them with DELETE /moments/{id}.
      responses:
        "200":
          description: Deletion receipt
          content:
            application/json:
              schema: { $ref: "./schemas/receipt.schema.json" }
              example:
                id: rcp_del_002
                kind: deletion
                created_at: "2026-11-15T14:10:00-06:00"
                summary: "Deleted the contact card for Ash. Also removed 1 promise with them."
                action_id: null
                source_moment_ids: []
                undo: { available: false, until: null }
        "404": { $ref: "#/components/responses/Error" }

  /people/{id}/brief:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [people]
      operationId: briefPerson
      summary: Pre-meeting brief, about 20 seconds spoken (D-6)
      responses:
        "200":
          description: Brief
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brief" }
              example:
                person: *Ash
                spoken: "Ash, Acme. You met today and talked about the Q4 launch. Ash promised to send the deck by Friday; that is still open."
                bullets:
                  - "Ash, Acme; met today"
                  - "Talked about the Q4 launch"
                  - "Open: deck by Friday (waiting on)"
                open_promises:
                  - *AshPromise
                sources:
                  - *AshIntroMoment
                  - *AshPromiseMoment
        "404": { $ref: "#/components/responses/Error" }

  /promises:
    get:
      tags: [promises]
      operationId: listPromises
      summary: Waiting on and I owe lists (D-4)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [proposed, confirmed, done, dismissed] } }
        - { name: direction, in: query, schema: { type: string, enum: [waiting_on, i_owe] } }
        - { name: person_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Promises
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "./schemas/promise.schema.json" } }
              example:
                items:
                  - *AshPromise
    post:
      tags: [promises]
      operationId: createPromise
      summary: Propose a promise (shows a confirm chip)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, person_id, what, source_moment_id]
              properties:
                direction: { type: string, enum: [waiting_on, i_owe] }
                person_id: { type: string }
                what: { type: string }
                due_text: { type: [string, "null"] }
                source_moment_id: { type: string }
      responses:
        "201":
          description: Proposed promise
          content:
            application/json:
              schema: { $ref: "./schemas/promise.schema.json" }
              example: *AshPromise

  /promises/{id}/confirm:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [promises]
      operationId: confirmPromise
      summary: One-tap confirm; moves the promise to its list
      responses:
        "200":
          description: Confirmed promise
          content:
            application/json:
              schema: { $ref: "./schemas/promise.schema.json" }
              example: *AshPromise
        "404": { $ref: "#/components/responses/Error" }

  /actions:
    get:
      tags: [actions]
      operationId: listActions
      summary: Actions, for example proposed emails waiting for approval
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [proposed, sent, draft_saved, done, undone, dismissed, failed] } }
        - { name: mode, in: query, schema: { $ref: "#/components/schemas/ModeId" } }
      responses:
        "200":
          description: Actions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "./schemas/action.schema.json" } }
              example:
                items:
                  - *FollowUp

  /actions/propose:
    post:
      tags: [actions]
      operationId: proposeAction
      summary: Propose an action with its source moments (D-7 for follow_up_email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [follow_up_email, flashcards, reminder, read_aloud, calendar_event, notes, message] }
                person_id: { type: [string, "null"], description: "Required for follow_up_email." }
                source_moment_ids: { type: array, items: { type: string }, description: "Required for every type except follow_up_email, which can find its own." }
                mode: { $ref: "#/components/schemas/ModeId" }
                title: { type: string, description: "Required for every type except follow_up_email." }
                summary: { type: string }
                event: { $ref: "./schemas/action.schema.json#/properties/event" }
                task: { $ref: "./schemas/action.schema.json#/properties/task" }
                doc: { $ref: "./schemas/action.schema.json#/properties/doc" }
                message: { $ref: "./schemas/action.schema.json#/properties/message" }
      responses:
        "201":
          description: Proposed action
          content:
            application/json:
              schema: { $ref: "./schemas/action.schema.json" }
              example: *FollowUp

  /actions/generate:
    post:
      tags: [actions, modes]
      operationId: generateAction
      summary: Turn one stored moment into a proposed action that Cortex writes itself (STU-2 flashcards, FOC-3 whiteboard notes, AST-2 read aloud)
      description: |
        Cortex writes the content from the moment (flashcards as Q/A pairs, notes as key points, the text to
        read aloud) and proposes it; nothing runs until the user confirms. Works in any mode because the user
        asked for it. Omit moment_id to use the newest moment with a snapshot (else the newest moment).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [flashcards, notes, read_aloud] }
                moment_id: { type: string, pattern: "^mom_" }
                mode: { $ref: "#/components/schemas/ModeId" }
            example: { type: flashcards, moment_id: mom_seed_005 }
      responses:
        "201":
          description: Proposed action
          content:
            application/json:
              schema: { $ref: "./schemas/action.schema.json" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /actions/{id}/confirm:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [actions]
      operationId: confirmAction
      summary: Approve and do it (email - send or save as draft; Google Calendar, Tasks or Drive; a Chert text), and write a receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliver]
              properties:
                deliver: { type: string, enum: [send, draft, do], description: "send or draft for email; send for message; do for the other types. calendar_event, reminder, flashcards and notes are written to the Google account the dashboard signed in with (forwarded by the dashboard proxy as X-Google-Access-Token); without one they are a dry run with external: null." }
                draft:
                  type: object
                  description: Optional user edits to the draft
                  properties:
                    to: { type: string }
                    subject: { type: string }
                    body: { type: string }
      responses:
        "200":
          description: Done, with receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
              example:
                action: *FollowUp
                receipt: *FollowUpReceipt

  /actions/{id}/undo:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [actions]
      operationId: undoAction
      summary: Undo while the undo window is open (deletes the calendar event or task, trashes the Drive doc, or cancels the held email or text)
      responses:
        "200":
          description: Undone, with receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "409": { $ref: "#/components/responses/Error" }

  /lists:
    get:
      tags: [lists]
      operationId: listLists
      summary: Shopping and expense lists (MEM-11)
      description: Filled by voice at ingest ("add oat milk to the shopping list", "log this receipt, $12 for lunch") or by hand.
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/List" } }
              example:
                items:
                  - id: shopping
                    name: Shopping
                    total: null
                    items:
                      - { id: itm_live_001, list: shopping, text: "oat milk", amount: null, done: false, source_moment_id: mom_live_002, created_at: "2026-11-15T14:02:40-06:00" }
                  - { id: expenses, name: Expenses, total: 0, items: [] }

  /lists/{id}/items:
    parameters:
      - { $ref: "#/components/parameters/ListId" }
    post:
      tags: [lists]
      operationId: addListItem
      summary: Add an item to a list by hand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1, maxLength: 200 }
                amount: { type: [number, "null"], description: "Expenses only." }
                source_moment_id: { type: [string, "null"] }
            example: { text: "batteries" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "./schemas/list-item.schema.json" }
              example: { id: itm_live_002, list: shopping, text: "batteries", amount: null, done: false, source_moment_id: null, created_at: "2026-11-15T14:03:00-06:00" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{id}/items/{item_id}:
    parameters:
      - { $ref: "#/components/parameters/ListId" }
      - { $ref: "#/components/parameters/ItemId" }
    patch:
      tags: [lists]
      operationId: updateListItem
      summary: Check off or edit a list item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1, maxLength: 200 }
                amount: { type: [number, "null"] }
                done: { type: boolean }
            example: { done: true }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "./schemas/list-item.schema.json" }
              example: { id: itm_live_002, list: shopping, text: "batteries", amount: null, done: true, source_moment_id: null, created_at: "2026-11-15T14:03:00-06:00" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [lists]
      operationId: deleteListItem
      summary: Remove a list item
      responses:
        "200":
          description: The removed item
          content:
            application/json:
              schema: { $ref: "./schemas/list-item.schema.json" }
              example: { id: itm_live_002, list: shopping, text: "batteries", amount: null, done: true, source_moment_id: null, created_at: "2026-11-15T14:03:00-06:00" }
        "404": { $ref: "#/components/responses/Error" }

  /receipts:
    get:
      tags: [receipts]
      operationId: listReceipts
      summary: Proof receipts, newest first
      responses:
        "200":
          description: Receipts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "./schemas/receipt.schema.json" } }
              example:
                items:
                  - *FollowUpReceipt

  /privacy:
    get:
      tags: [privacy]
      operationId: getPrivacy
      summary: Current capture state
      responses:
        "200":
          description: State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyState" }
              example: { state: capturing, since: "2026-11-15T14:00:00-06:00" }

  /privacy/pause:
    post:
      tags: [privacy]
      operationId: setPrivacy
      summary: Pause, go off-the-record, or resume capture (D-9)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [capturing, paused, off_record] }
            example: { state: off_record }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyState" }
              example: { state: off_record, since: "2026-11-15T14:08:00-06:00" }

  /calls/started:
    post:
      tags: [calls]
      operationId: callStarted
      summary: The call agent reports that a FaceTime call is live (D-10); emits call.started
      description: |
        Idempotent: repeating it for the active `call_id` changes nothing and emits nothing.
        If a different call is still active (one call at a time), that call is ended first and
        `call.ended` is emitted for it, then `call.started` for the new one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallRef" }
            example: { call_id: "call_1a2b3c" }
      responses:
        "200":
          description: The active call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
              example: { call_id: "call_1a2b3c", started_at: "2026-11-15T14:10:00-06:00", ended_at: null }
        "400": { $ref: "#/components/responses/Error" }

  /calls/ended:
    post:
      tags: [calls]
      operationId: callEnded
      summary: The call agent reports that the call is over (D-10); emits call.ended
      description: |
        Idempotent: repeating it for a call that already ended returns it again and emits nothing.
        404 when the backend never saw `call_id` (for example after a restart); the call agent ignores that.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallRef" }
            example: { call_id: "call_1a2b3c" }
      responses:
        "200":
          description: The call, with `ended_at` set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
              example: { call_id: "call_1a2b3c", started_at: "2026-11-15T14:10:00-06:00", ended_at: "2026-11-15T14:12:30-06:00" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /calls/current:
    get:
      tags: [calls]
      operationId: getCurrentCall
      summary: The call in progress, if any, so a dashboard opened mid-call still shows "On Call" (D-10)
      description: |
        Calls cap at 5 minutes on the Chert line. A call that has no `call.ended` after 6 minutes
        counts as ended, so a crashed agent cannot leave the dashboard stuck on "On Call".
      responses:
        "200":
          description: "The active call, or call: null"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentCall" }
              example: { call: { call_id: "call_1a2b3c", started_at: "2026-11-15T14:10:00-06:00", ended_at: null } }

  /modes/{id}/activate:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [modes]
      operationId: activateMode
      summary: Make this mode the active one (the mode dock, a voice command or a confirmed suggestion); emits mode.changed
      description: Clears any pending mode suggestion. Cortex never switches silently; clients confirm with a chime and the spoken label.
      responses:
        "200":
          description: The now-active mode
          content:
            application/json:
              schema: { $ref: "./schemas/mode.schema.json" }
        "404": { $ref: "#/components/responses/Error" }

  /modes/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [modes]
      operationId: updateMode
      summary: Change a mode's settings (DASH-10), e.g. which actions it may suggest; emits mode.changed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeUpdate" }
            example: { allowed_actions: [flashcards, calendar_event], retention_days: 30 }
      responses:
        "200":
          description: The updated mode
          content:
            application/json:
              schema: { $ref: "./schemas/mode.schema.json" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [modes]
      operationId: deleteMode
      summary: Delete a custom mode (MODE-7). Built-in modes cannot be deleted (409). If it was active, Focus becomes active.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /modes:
    get:
      tags: [modes]
      operationId: listModes
      summary: Mode presets; one is active. Also the pending mode suggestion, if any (MODE-2 auto-suggest).
      responses:
        "200":
          description: Modes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "./schemas/mode.schema.json" } }
                  suggestion:
                    oneOf:
                      - { $ref: "#/components/schemas/ModeSuggestion" }
                      - { type: "null" }
              example:
                items:
                  - id: focus
                    name: Focus
                    captures: [meeting audio, whiteboard snapshots]
                    speaks: on request or at meeting end
                    proposes: [follow-up email]
                    allowed_actions: [follow_up_email]
                    auto_suggest: true
                    retention_days: null
                    active: true
                suggestion: null
    post:
      tags: [modes]
      operationId: createMode
      summary: Create a custom mode (MODE-7, API only). It starts inactive.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeCreate" }
            example: { name: Lab, captures: [lab steps], speaks: on request, proposes: [notes], allowed_actions: [notes] }
      responses:
        "201":
          description: Created mode
          content:
            application/json:
              schema: { $ref: "./schemas/mode.schema.json" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /modes/suggestion/dismiss:
    post:
      tags: [modes]
      operationId: dismissModeSuggestion
      summary: Say no to the pending mode suggestion. The same mode is not suggested again for 30 minutes.
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                type: object
                required: [dismissed]
                properties:
                  dismissed: { type: boolean, description: "False when nothing was pending." }

  /recap:
    get:
      tags: [modes]
      operationId: getRecap
      summary: Recap of the latest session (FOC-2 meeting recap, STU-1 live lecture notes, FOC-1 action items)
      description: |
        A session is the newest run of moments with no gap over 30 minutes. Built only from stored moments;
        every note, decision and follow-up links its source moment. moment_count is 0 when there is nothing.
      parameters:
        - { name: mode, in: query, description: "Only moments captured in this mode.", schema: { $ref: "#/components/schemas/ModeId" } }
        - { name: kind, in: query, schema: { type: string, enum: [meeting, lecture], default: meeting } }
      responses:
        "200":
          description: Recap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recap" }

  /look:
    post:
      tags: [modes]
      operationId: look
      summary: Look at the scene and answer now (AST-1 describe, AST-2 read, AST-3 hazards, AST-4 find, STU-3 tutor)
      description: |
        Nothing is stored: the answer is spoken and shown, and the user can save the view as a moment
        afterwards (POST /moments). Send snapshot_base64 for what the camera sees now; otherwise moment_id,
        or the newest moment with a snapshot from the last 10 minutes. find without a view searches memory.
        Assist is support, not a medical or mobility device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, enum: [describe, read, hazards, find, tutor] }
                target: { type: string, description: "find: the object; hazards: what to look for, e.g. the door." }
                question: { type: string, description: "tutor: what the user asked about the problem." }
                snapshot_base64: { type: [string, "null"], description: "JPEG of what the camera sees now. Not stored." }
                moment_id: { type: string, pattern: "^mom_" }
            example: { task: read }
      responses:
        "200":
          description: What Cortex saw
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookResult" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /routines:
    get:
      tags: [modes]
      operationId: listRoutines
      summary: Routine reminders (AST-5), next first
      responses:
        "200":
          description: Routines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "./schemas/routine.schema.json" } }
    post:
      tags: [modes]
      operationId: createRoutine
      summary: Add a routine reminder; emits routine.due at its time
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutineIn" }
            example: { title: Take the evening medicine, time: "20:00", days: [] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "./schemas/routine.schema.json" }
        "400": { $ref: "#/components/responses/Error" }

  /routines/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [modes]
      operationId: updateRoutine
      summary: Change a routine reminder (pause it with active false)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutineUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "./schemas/routine.schema.json" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [modes]
      operationId: deleteRoutine
      summary: Delete a routine reminder
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /caregiver:
    get:
      tags: [modes]
      operationId: getCaregiver
      summary: Caregiver sharing (AST-6, AST-7) and a preview of exactly what today's summary would send
      responses:
        "200":
          description: Caregiver settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Caregiver" }
    put:
      tags: [modes]
      operationId: setCaregiver
      summary: Give or revoke consent. With consent, the summary is emailed daily at send_at (dry run unless email is set up).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaregiverIn" }
            example: { consent: true, name: Sam, email: "sam@example.com", send_at: "20:00" }
      responses:
        "200":
          description: Caregiver settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Caregiver" }
        "400": { $ref: "#/components/responses/Error" }

  /caregiver/send:
    post:
      tags: [modes]
      operationId: sendCaregiverSummary
      summary: Send today's summary now (the same as the daily send), with a receipt and an undo window
      responses:
        "200":
          description: The caregiver_summary action and its receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "409": { $ref: "#/components/responses/Error" }

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live event stream for the dashboard (Server-Sent Events)
      description: |
        Each SSE message has `event: <type>` and `data: <JSON>`. Types:
        moment.created, moment.deleted, person.created, person.updated, person.deleted, promise.proposed,
        promise.confirmed, action.proposed, action.updated, receipt.created, privacy.changed, mode.changed,
        mode.suggested, routine.due, list.updated, call.started, call.ended. person.deleted carries {id};
        list.updated carries the whole List; mode.suggested carries a ModeSuggestion; routine.due carries the
        Routine that is due now (clients speak its spoken line).
        The data payload is the affected entity (see components.schemas.Event).
        For call.started and call.ended the payload is a Call (components.schemas.Call).
        Prism returns the example once; real streaming comes from the backend.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: moment.created
                data: {"type":"moment.created","at":"2026-11-15T14:02:12-06:00","data":{"id":"mom_live_001"}}

components:
  securitySchemes:
    cortexKey: { type: apiKey, in: header, name: X-Cortex-Key }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    ListId:
      name: id
      in: path
      required: true
      schema: { type: string, enum: [shopping, expenses] }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "No such moment." } }
  schemas:
    ModeId:
      type: string
      pattern: "^[a-z][a-z0-9_-]{1,31}$"
      description: "A mode id: focus, student, life, assist, or a custom mode's slug."
    ModeSuggestion:
      type: object
      description: "Cortex thinks another mode fits (MODE-2). It never switches on its own: the user confirms (activate, or say yes) or dismisses."
      required: [mode_id, reason, moment_id, at]
      properties:
        mode_id: { $ref: "#/components/schemas/ModeId" }
        reason: { type: string, description: "Short, e.g. Sounds like a lecture." }
        moment_id: { type: [string, "null"], description: "The moment that prompted it." }
        at: { type: string, format: date-time }
    ModeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, maxLength: 200 }
        captures: { type: array, items: { type: string } }
        speaks: { type: string }
        proposes: { type: array, items: { type: string } }
        allowed_actions: { $ref: "./schemas/mode.schema.json#/properties/allowed_actions" }
        auto_suggest: { type: boolean }
        retention_days: { type: ["integer", "null"], minimum: 1 }
    ModeCreate:
      type: object
      required: [name]
      properties:
        id: { $ref: "#/components/schemas/ModeId" }
        name: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, maxLength: 200 }
        captures: { type: array, items: { type: string } }
        speaks: { type: string }
        proposes: { type: array, items: { type: string } }
        allowed_actions: { $ref: "./schemas/mode.schema.json#/properties/allowed_actions" }
        auto_suggest: { type: boolean }
        retention_days: { type: ["integer", "null"], minimum: 1 }
    RecapLine:
      type: object
      required: [text, moment_id]
      properties:
        text: { type: string }
        moment_id: { type: string, pattern: "^mom_" }
        at: { type: string, format: date-time }
    Recap:
      type: object
      required: [kind, title, spoken, bullets, notes, decisions, follow_ups, started_at, ended_at, moment_count, source_moment_ids]
      properties:
        kind: { type: string, enum: [meeting, lecture] }
        mode: { oneOf: [{ $ref: "#/components/schemas/ModeId" }, { type: "null" }] }
        title: { type: string }
        spoken: { type: string, description: "The recap to speak (about 20 seconds)." }
        bullets: { type: array, items: { type: string } }
        notes: { type: array, items: { $ref: "#/components/schemas/RecapLine" }, description: "Running notes, oldest first, one per moment." }
        decisions: { type: array, items: { $ref: "#/components/schemas/RecapLine" } }
        follow_ups: { type: array, items: { $ref: "#/components/schemas/RecapLine" }, description: "Action items and promises from the session." }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        moment_count: { type: integer, minimum: 0 }
        source_moment_ids: { type: array, items: { type: string, pattern: "^mom_" } }
    LookResult:
      type: object
      required: [task, spoken, text, found, moment]
      properties:
        task: { type: string, enum: [describe, read, hazards, find, tutor] }
        spoken: { type: string }
        text: { type: string, description: "The full answer (read: the text as printed; tutor: the steps)." }
        found: { type: [boolean, "null"], description: "find and hazards: whether it was seen; null for the other tasks." }
        moment: { oneOf: [{ $ref: "./schemas/moment.schema.json" }, { type: "null" }], description: "The stored moment used, if any (never the live view)." }
    RoutineIn:
      type: object
      required: [title, time]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        time: { $ref: "./schemas/routine.schema.json#/properties/time" }
        days: { $ref: "./schemas/routine.schema.json#/properties/days" }
        spoken: { type: string, maxLength: 200 }
    RoutineUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        time: { $ref: "./schemas/routine.schema.json#/properties/time" }
        days: { $ref: "./schemas/routine.schema.json#/properties/days" }
        spoken: { type: string, maxLength: 200 }
        active: { type: boolean }
    CaregiverIn:
      type: object
      required: [consent]
      properties:
        consent: { type: boolean, description: "false revokes sharing at once." }
        name: { type: [string, "null"], maxLength: 80 }
        email: { type: [string, "null"], format: email, description: "Required when consent is true." }
        send_at: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Local HH:MM; default 20:00." }
    Caregiver:
      type: object
      required: [consent, name, email, send_at, consented_at, last_sent_at, shares, preview]
      properties:
        consent: { type: boolean }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        send_at: { type: string }
        consented_at: { type: [string, "null"], format: date-time }
        last_sent_at: { type: [string, "null"], format: date-time }
        shares: { type: array, items: { type: string }, description: "Plain list of what the summary includes and what it never includes." }
        preview:
          type: object
          description: Exactly what today's email would say.
          required: [subject, body, source_moment_ids]
          properties:
            subject: { type: string }
            body: { type: string }
            source_moment_ids: { type: array, items: { type: string, pattern: "^mom_" } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    MomentIngest:
      type: object
      description: What capture sends. At least one of transcript, audio_base64, snapshot_base64, snapshot_url or video_base64.
      required: [ts, source]
      properties:
        ts: { type: string, format: date-time }
        source: { type: string, enum: [glasses, phone, call, dashboard] }
        mode: { $ref: "#/components/schemas/ModeId" }
        transcript: { type: [string, "null"], description: "If capture already transcribed it." }
        audio_base64: { type: [string, "null"], description: "Short audio clip if not transcribed on device." }
        snapshot_base64: { type: [string, "null"], description: "JPEG snapshot." }
        snapshot_url: { type: [string, "null"] }
        video_base64: { type: [string, "null"], description: "QuickTime or MP4 clip, at most 10 seconds and 20 MB decoded." }
        call_id: { type: [string, "null"], description: "Set by the call agent for caller-camera moments." }
    AskAnswer:
      type: object
      required: [answer, spoken, grounded, sources, receipt_id]
      properties:
        answer: { type: string, description: "Full answer for the dashboard." }
        spoken: { type: string, description: "Short version for TTS." }
        grounded: { type: boolean, description: "False when memory has nothing to support an answer." }
        sources: { type: array, items: { $ref: "./schemas/moment.schema.json" } }
        receipt_id: { type: string }
    Brief:
      type: object
      required: [person, spoken, bullets, open_promises, sources]
      properties:
        person: { $ref: "./schemas/person.schema.json" }
        spoken: { type: string, description: "About 20 seconds when spoken." }
        bullets: { type: array, maxItems: 3, items: { type: string } }
        open_promises: { type: array, items: { $ref: "./schemas/promise.schema.json" } }
        sources: { type: array, items: { $ref: "./schemas/moment.schema.json" } }
    Digest:
      type: object
      required: [date, spoken, bullets, moment_count, people, promises, actions, source_moment_ids]
      properties:
        date: { type: string, format: date }
        spoken: { type: string, description: "The recap to speak." }
        bullets: { type: array, items: { type: string } }
        moment_count: { type: integer, minimum: 0 }
        people: { type: array, items: { $ref: "./schemas/person.schema.json" }, description: "Met or seen that day." }
        promises: { type: array, items: { $ref: "./schemas/promise.schema.json" }, description: "Made that day, either direction." }
        actions: { type: array, items: { $ref: "./schemas/action.schema.json" } }
        source_moment_ids: { type: array, items: { type: string, pattern: "^mom_" } }
    Rewind:
      type: object
      required: [found, moment, line, spoken]
      properties:
        found: { type: boolean }
        moment: { oneOf: [{ $ref: "./schemas/moment.schema.json" }, { type: "null" }] }
        line: { type: [string, "null"], description: "The exact transcript sentence; null for a snapshot with no words." }
        spoken: { type: string }
    List:
      type: object
      required: [id, name, items, total]
      properties:
        id: { type: string, enum: [shopping, expenses] }
        name: { type: string }
        items: { type: array, items: { $ref: "./schemas/list-item.schema.json" }, description: "Newest first." }
        total: { type: [number, "null"], description: "Expenses: the sum of amounts. Shopping: null." }
    ActionResult:
      type: object
      required: [action, receipt]
      properties:
        action: { $ref: "./schemas/action.schema.json" }
        receipt: { $ref: "./schemas/receipt.schema.json" }
    PrivacyState:
      type: object
      required: [state, since]
      properties:
        state: { type: string, enum: [capturing, paused, off_record] }
        since: { type: string, format: date-time }
    CallRef:
      type: object
      required: [call_id]
      properties:
        call_id: { type: string, minLength: 1, description: "Chert call id (the bridge participant is chert-bridge-<call id>)." }
    Call:
      type: object
      description: One FaceTime call. This is also the `data` of the call.started and call.ended events.
      required: [call_id, started_at, ended_at]
      properties:
        call_id: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time, description: "Null while the call is live." }
    CurrentCall:
      type: object
      required: [call]
      properties:
        call:
          oneOf:
            - { $ref: "#/components/schemas/Call" }
            - { type: "null" }
    Event:
      type: object
      required: [type, at, data]
      properties:
        type:
          type: string
