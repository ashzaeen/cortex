 stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="949" y="310" font-size="22" font-weight="700" fill="#e4c382">Memory search</text><text x="949" y="346" font-size="17" fill="#dcd5c0">Atlas $vectorSearch with</text><text x="949" y="370" font-size="17" fill="#dcd5c0">time filter + freshness merge</text><rect x="580" y="392" width="325" height="112" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="604" y="434" font-size="22" font-weight="700" fill="#e4c382">Skills</text><text x="604" y="470" font-size="17" fill="#dcd5c0">Network · Waiting-on · Brief</text><text x="604" y="494" font-size="17" fill="#dcd5c0">Ask · Digest · Rewind · Lists</text><rect x="925" y="392" width="325" height="112" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="949" y="434" font-size="22" font-weight="700" fill="#e4c382">Modes</text><text x="949" y="470" font-size="17" fill="#dcd5c0">Focus · Student · Life · Assist</text><text x="949" y="494" font-size="17" fill="#dcd5c0">presets over one memory</text><rect x="580" y="516" width="325" height="112" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="604" y="558" font-size="22" font-weight="700" fill="#e4c382">Action loop</text><text x="604" y="594" font-size="17" fill="#dcd5c0">propose · confirm · undo</text><text x="604" y="618" font-size="17" fill="#dcd5c0">receipts with source moment</text><rect x="925" y="516" width="325" height="112" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="949" y="558" font-size="22" font-weight="700" fill="#e4c382">Privacy</text><text x="949" y="594" font-size="17" fill="#dcd5c0">pause · off the record</text><text x="949" y="618" font-size="17" fill="#dcd5c0">cascade delete</text><rect x="580" y="640" width="325" height="112" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="604" y="682" font-size="22" font-weight="700" fill="#e4c382"