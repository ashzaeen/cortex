<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="glow" cx="20%" cy="0%" r="90%"><stop offset="0" stop-color="#1f5a48" stop-opacity=".55"/><stop offset="1" stop-color="#08130f" stop-opacity="0"/></radialGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2a860"/></marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3a8"/></marker>
</defs>
<rect width="1800" height="1200" fill="#08130f"/><rect width="1800" height="1200" fill="url(#glow)"/>
<text x="60" y="78" font-size="44" font-weight="700" fill="#eee7d4">Remember, then answer with proof</text>
<text x="60" y="118" font-size="24" fill="#9fb3a8">One ingest pipeline for every channel. Answers come only from retrieved moments.</text>
<line x1="60" y1="140" x2="1740" y2="140" stroke="#d2a860" stroke-opacity=".5"/>
<text x="60" y="190" font-size="24" font-weight="700" fill="#d2a860" text-anchor="start">1 · REMEMBER  (POST /moments)</text><rect x="60" y="220" width="316" height="240" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="84" y="264" font-size="24" font-weight="700" fill="#e4c382">Moment in</text><text x="84" y="304" font-size="19" fill="#dcd5c0">Photo, ≤10 s video, audio</text><text x="84" y="332" font-size="19" fill="#dcd5c0">or transcript, plus device</text><text x="84" y="360" font-size="19" fill="#dcd5c0">time and source: glasses,</text><text x="84" y="388" font-size="19" fill="#dcd5c0">phone or call</text><path d="M376 340 L401 340" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="401" y="220" width="316" height="240" rx="22" fill="#12372e" stroke="#d2a860" stroke-width="2.5"/><text x="425" y="264" font-size="24" font-weight="700" fill="#e4c382">Gemini perception</text><text x="425" y="304" font-size="19" fill="#dcd5c0">Scene caption</text><text x="425" y="332" font-size="19" fill="#dcd5c0">Spoken words in video</text><text x="425" y="360" font-size="19" fill="#dcd5c0">Introductions and promises</text><text x="425" y="388" font-size="19" fill="#dcd5c0">with due dates</text><path d="M717 340 L742 340" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="742" y="220" width="316" height="240" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="766" y="264" font-size="24" font-weight="700" fill="#e4c382">Embed</text><text x="766" y="304" font-size="19" fill="#dcd5c0">gemini-embedding-001</text><text x="766" y="332" font-size="19" fill="#dcd5c0">on transcript + caption</text><path d="M1058 340 L1083 340" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="1083" y="220" width="316" height="240" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="1107" y="264" font-size="24" font-weight="700" fill="#e4c382">Store</text><text x="1107" y="304" font-size="19" fill="#dcd5c0">MongoDB Atlas: moment,</text><text x="1107" y="332" font-size="19" fill="#dcd5c0">embedding, media</text><text x="1107" y="360" font-size="19" fill="#dcd5c0">Tiger Data: timeline row</text><path d="M1399 340 L1424 340" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="1424" y="220" width="316" height="240" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="1448" y="264" font-size="24" font-weight="700" fill="#e4c382">Derive + broadcast</text><text x="1448" y="304" font-size="19" fill="#dcd5c0">Contact card, promise chip</text><text x="1448" y="332" font-size="19" fill="#dcd5c0">List items, brief pre-warm</text><text x="1448" y="360" font-size="19" fill="#dcd5c0">Follow-up proposal</text><text x="1448" y="388" font-size="19" fill="#dcd5c0">SSE: moment.created …</text><rect x="60" y="485" width="800" height="44" rx="22" fill="#050b09" stroke="#e58a76" stroke-width="1.5"/><text x="460" y="514" text-anchor="middle" font-size="19" font-weight="600" fill="#e58a76">Paused or off the record? Ingest returns 409 and nothing is stored</text><text x="60" y="640" font-size="24" font-weight="700" fill="#d2a860" text-anchor="start">2 · ANSWER WITH PROOF  (POST /ask)</text><rect x="60" y="670" width="300" height="235" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="84" y="714" font-size="24" font-weight="700" fill="#e4c382">Question</text><text x="84" y="754" font-size="19" fill="#dcd5c0">Voice on the glasses,</text><text x="84" y="782" font-size="19" fill="#dcd5c0">text in the dashboard,</text><text x="84" y="810" font-size="19" fill="#dcd5c0">or spoken on a</text><text x="84" y="838" font-size="19" fill="#dcd5c0">FaceTime call</text><path d="M360 787 L405 787" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="405" y="670" width="300" height="235" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="429" y="714" font-size="24" font-weight="700" fill="#e4c382">Route</text><text x="429" y="754" font-size="19" fill="#dcd5c0">Rewind · daily digest ·</text><text x="429" y="782" font-size="19" fill="#dcd5c0">lists · brief me on X ·</text><text x="429" y="810" font-size="19" fill="#dcd5c0">mode commands · the</text><text x="429" y="838" font-size="19" fill="#dcd5c0">open-promises table</text><path d="M705 787 L750 787" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="750" y="670" width="300" height="235" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="774" y="714" font-size="24" font-weight="700" fill="#e4c382">Search</text><text x="774" y="754" font-size="19" fill="#dcd5c0">A time phrase narrows</text><text x="774" y="782" font-size="19" fill="#dcd5c0">the range, then Atlas</text><text x="774" y="810" font-size="19" fill="#dcd5c0">$vectorSearch. Moments</text><text x="774" y="838" font-size="19" fill="#dcd5c0">from the last minutes</text><text x="774" y="866" font-size="19" fill="#dcd5c0">are merged in</text><path d="M1050 787 L1095 787" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="1095" y="670" width="300" height="235" rx="22" fill="#12372e" stroke="#d2a860" stroke-width="2.5"/><text x="1119" y="714" font-size="24" font-weight="700" fill="#e4c382">Grounded answer</text><text x="1119" y="754" font-size="19" fill="#dcd5c0">Gemini answers ONLY</text><text x="1119" y="782" font-size="19" fill="#dcd5c0">from retrieved moments;</text><text x="1119" y="810" font-size="19" fill="#dcd5c0">cited ids are checked</text><text x="1119" y="838" font-size="19" fill="#dcd5c0">against the hits</text><rect x="1470" y="670" width="270" height="105" rx="22" fill="#16301f" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="1494" y="713" font-size="23" font-weight="700" fill="#8fc9a6">Grounded</text><text x="1494" y="754" font-size="19" fill="#dcd5c0">answer + sources</text><rect x="1470" y="795" width="270" height="130" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="1494" y="838" font-size="23" font-weight="700" fill="#e58a76">No support</text><text x="1494" y="876" font-size="19" fill="#dcd5c0">"I don't have that</text><text x="1494" y="902" font-size="19" fill="#dcd5c0">in memory."</text><path d="M1395 760 L1470 722" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><path d="M1395 820 L1470 850" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><text x="60" y="945" font-size="21" font-weight="600" fill="#dcd5c0" text-anchor="start">Every answer, grounded or not, writes a proof receipt with its source moments attached.</text><rect x="60" y="990" width="1680" height="130" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="90" y="1034" font-size="24" font-weight="700" fill="#e4c382">Forget means forget</text><text x="90" y="1070" font-size="20" fill="#dcd5c0">Deleting a moment removes its embedding, snapshot or video, derived promises, the people it introduced and its</text><text x="90" y="1098" font-size="20" fill="#dcd5c0">Tiger Data row, then returns a deletion receipt.</text><text x="1740" y="1172" text-anchor="end" font-size="20" fill="#9fb3a8">Cortex · HackUTA 2026 · one memory, many channels, every answer with proof</text></svg>