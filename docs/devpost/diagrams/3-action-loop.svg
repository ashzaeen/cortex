<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="glow" cx="20%" cy="0%" r="90%"><stop offset="0" stop-color="#1f5a48" stop-opacity=".55"/><stop offset="1" stop-color="#08130f" stop-opacity="0"/></radialGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2a860"/></marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3a8"/></marker>
</defs>
<rect width="1800" height="1200" fill="#08130f"/><rect width="1800" height="1200" fill="url(#glow)"/>
<text x="60" y="78" font-size="44" font-weight="700" fill="#eee7d4">The action loop: notice, propose, confirm, do, prove</text>
<text x="60" y="118" font-size="24" fill="#9fb3a8">Cortex follows through, but nothing leaves the device without a yes.</text>
<line x1="60" y1="140" x2="1740" y2="140" stroke="#d2a860" stroke-opacity=".5"/>
<rect x="75" y="190" width="290" height="270" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="99" y="239" font-size="29" font-weight="700" fill="#e4c382">1  Notice</text><text x="99" y="281" font-size="20" fill="#dcd5c0">Gemini spots a promise,</text><text x="99" y="311" font-size="20" fill="#dcd5c0">deadline or need in what</text><text x="99" y="341" font-size="20" fill="#dcd5c0">was said or seen, e.g.</text><text x="99" y="371" font-size="20" fill="#dcd5c0">"I'll send the deck Friday"</text><path d="M365 325 L415 325" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="415" y="190" width="290" height="270" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="439" y="239" font-size="29" font-weight="700" fill="#e4c382">2  Propose</text><text x="439" y="281" font-size="20" fill="#dcd5c0">A confirm chip or a drafted</text><text x="439" y="311" font-size="20" fill="#dcd5c0">action with details filled</text><text x="439" y="341" font-size="20" fill="#dcd5c0">in, tied to its source</text><text x="439" y="371" font-size="20" fill="#dcd5c0">moment.</text><path d="M705 325 L755 325" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="755" y="190" width="290" height="270" rx="22" fill="#12372e" stroke="#d2a860" stroke-width="2.5"/><text x="779" y="239" font-size="29" font-weight="700" fill="#e4c382">3  Confirm</text><text x="779" y="281" font-size="20" fill="#dcd5c0">Say or tap: yes, edit,</text><text x="779" y="311" font-size="20" fill="#dcd5c0">skip. Edit changes the</text><text x="779" y="341" font-size="20" fill="#dcd5c0">draft before approval.</text><text x="779" y="371" font-size="20" fill="#dcd5c0">Skip leaves a receipt.</text><path d="M1045 325 L1095 325" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="1095" y="190" width="290" height="270" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="1119" y="239" font-size="29" font-weight="700" fill="#e4c382">4  Do</text><text x="1119" y="281" font-size="20" fill="#dcd5c0">Email held for 30 s, then</text><text x="1119" y="311" font-size="20" fill="#dcd5c0">sent. Calendar, Tasks,</text><text x="1119" y="341" font-size="20" fill="#dcd5c0">Drive notes + flashcards,</text><text x="1119" y="371" font-size="20" fill="#dcd5c0">expense log, text.</text><path d="M1385 325 L1435 325" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)"/><rect x="1435" y="190" width="290" height="270" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="1459" y="239" font-size="29" font-weight="700" fill="#e4c382">5  Prove</text><text x="1459" y="281" font-size="20" fill="#dcd5c0">A receipt with the source</text><text x="1459" y="311" font-size="20" fill="#dcd5c0">moment, status and an</text><text x="1459" y="341" font-size="20" fill="#dcd5c0">Undo button. Visible in</text><text x="1459" y="371" font-size="20" fill="#dcd5c0">the dashboard right away.</text><path d="M1580 460 L1580 505 L1240 505 L1240 460" fill="none" stroke="#9fb3a8" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#ahd)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="1410" y="494" font-size="19" font-weight="500" fill="#9fb3a8" text-anchor="middle">undo inside the window</text><rect x="60" y="560" width="800" height="560" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="84" y="606" font-size="27" font-weight="700" fill="#e4c382">Safety rails</text><text x="84" y="660" font-size="21" fill="#dcd5c0">•  Email, calendar events and texts always need a yes.</text><text x="84" y="713" font-size="21" fill="#dcd5c0">•  Auto-run is off by default, set per mode, and covers only</text><text x="112" y="746" font-size="21" fill="#dcd5c0">reminders, notes, flashcards and expenses.</text><text x="84" y="799" font-size="21" fill="#dcd5c0">•  30-second undo window. A held send or text survives</text><text x="112" y="832" font-size="21" fill="#dcd5c0">a server restart.</text><text x="84" y="885" font-size="21" fill="#dcd5c0">•  Follow-up drafts go to a recipient the server controls, so</text><text x="112" y="918" font-size="21" fill="#dcd5c0">a misheard name cannot redirect an email.</text><text x="84" y="971" font-size="21" fill="#dcd5c0">•  On a call, the agent can send only after an explicit</text><text x="112" y="1004" font-size="21" fill="#dcd5c0">spoken yes.</text><text x="84" y="1057" font-size="21" fill="#dcd5c0">•  Every action is logged and shown as a receipt.</text><rect x="900" y="560" width="840" height="560" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="924" y="606" font-size="27" font-weight="700" fill="#e4c382">Actions built into the loop</text><text x="924" y="650" font-size="19" font-weight="700" fill="#9fb3a8">ACTION</text><text x="1190" y="650" font-size="19" font-weight="700" fill="#9fb3a8">WHERE IT GOES</text><text x="1570" y="650" font-size="19" font-weight="700" fill="#9fb3a8">APPROVAL</text><line x1="924" y1="668" x2="1716" y2="668" stroke="rgba(238,231,212,0.22)"/><text x="924" y="700" font-size="21" font-weight="600" fill="#eee7d4">Follow-up email</text><text x="1190" y="700" font-size="19" fill="#dcd5c0">Resend or SMTP · confirm to send</text><text x="1570" y="700" font-size="19" font-weight="600" fill="#e4c382">yes</text><line x1="924" y1="726" x2="1716" y2="726" stroke="rgba(238,231,212,0.22)"/><text x="924" y="758" font-size="21" font-weight="600" fill="#eee7d4">Calendar event</text><text x="1190" y="758" font-size="19" fill="#dcd5c0">Google Calendar</text><text x="1570" y="758" font-size="19" font-weight="600" fill="#e4c382">yes</text><line x1="924" y1="784" x2="1716" y2="784" stroke="rgba(238,231,212,0.22)"/><text x="924" y="816" font-size="21" font-weight="600" fill="#eee7d4">Reminder</text><text x="1190" y="816" font-size="19" fill="#dcd5c0">Google Tasks</text><text x="1570" y="816" font-size="19" font-weight="600" fill="#dcd5c0">shown in recap</text><line x1="924" y1="842" x2="1716" y2="842" stroke="rgba(238,231,212,0.22)"/><text x="924" y="874" font-size="21" font-weight="600" fill="#eee7d4">Notes + flashcards</text><text x="1190" y="874" font-size="19" fill="#dcd5c0">Google Docs in Drive</text><text x="1570" y="874" font-size="19" font-weight="600" fill="#dcd5c0">shown in recap</text><line x1="924" y1="900" x2="1716" y2="900" stroke="rgba(238,231,212,0.22)"/><text x="924" y="932" font-size="21" font-weight="600" fill="#eee7d4">Expense</text><text x="1190" y="932" font-size="19" fill="#dcd5c0">logged from a receipt, undoable</text><text x="1570" y="932" font-size="19" font-weight="600" fill="#dcd5c0">shown in recap</text><line x1="924" y1="958" x2="1716" y2="958" stroke="rgba(238,231,212,0.22)"/><text x="924" y="990" font-size="21" font-weight="600" fill="#eee7d4">Text a contact</text><text x="1190" y="990" font-size="19" fill="#dcd5c0">Chert shared line, text shown first</text><text x="1570" y="990" font-size="19" font-weight="600" fill="#e4c382">yes</text><line x1="924" y1="1016" x2="1716" y2="1016" stroke="rgba(238,231,212,0.22)"/><text x="924" y="1048" font-size="21" font-weight="600" fill="#eee7d4">Read aloud</text><text x="1190" y="1048" font-size="19" fill="#dcd5c0">on the glasses (Assist)</text><text x="1570" y="1048" font-size="19" font-weight="600" fill="#dcd5c0">no</text><text x="1740" y="1172" text-anchor="end" font-size="20" fill="#9fb3a8">Cortex · HackUTA 2026 · one memory, many channels, every answer with proof</text></svg>