 text-anchor="middle" font-size="17" fill="#9fb3a8">FastAPI · Railway</text><line x1="1330" y1="249" x2="1330" y2="1060" stroke="#9fb3a8" stroke-opacity=".45" stroke-dasharray="3 9" stroke-width="2"/><rect x="1505" y="165" width="230" height="84" rx="20" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="2"/><text x="1620" y="205" text-anchor="middle" font-size="25" font-weight="700" fill="#e4c382">Gemini Live</text><text x="1620" y="234" text-anchor="middle" font-size="17" fill="#9fb3a8">voice + vision</text><line x1="1620" y1="249" x2="1620" y2="1060" stroke="#9fb3a8" stroke-opacity=".45" stroke-dasharray="3 9" stroke-width="2"/><path d="M175 300 L414 300" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="297.5" y="287" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">FaceTime Video call to the Chert line</text><path d="M420 355 L684 355" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="555" y="342" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">Bridge the call into a LiveKit room</text><path d="M690 410 L994 410" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="845" y="397" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">chert_bridge_ready → greet (must be &lt; 10 s)</text><path d="M1000 465 L181 465" fill="none" stroke="#9fb3a8" stroke-width="2.6" stroke-dasharray="9 8" marker-end="url(#ahd)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="587.5" y="452" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">Spoken greeting</text><path d="M175 520 L994 520" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="587.5" y="507" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">Caller voice + camera frames</text><path d="M1000 575 L1614 575" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="1310" y="562" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">Realtime audio + frames</text><path d="M1620 630 L1006 630" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="1310" y="617" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">Tool call: ask_memory("What did Ash promise me?")</text><path d="M1000 685 L1324 685" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="1165" y="672" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">POST /ask  channel: call</text><path d="M1330 740 L1006 740" fill="none" stroke="#9fb3a8" stroke-width="2.6" stroke-dasharray="9 8" marker-end="url(#ahd)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="1165" y="727" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">Grounded answer + source moment + receipt</text><path d="M1000 795 L1324 795" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="1165" y="782" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">"Save this": POST /moments  source: call</text><path d="M1000 850 L1324 850" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="1165" y="837" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">draft_followup → send (needs yes) → undo</text><path d="M1000 905 L1324 905" fill="none" stroke="#d2a860" stroke-width="2.6" marker-end="url(#ah)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="1165" y="892" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">POST /calls/started · /calls/ended</text><path d="M1000 960 L181 960" fill="none" stroke="#9fb3a8" stroke-width="2.6" stroke-dasharray="9 8" marker-end="url(#ahd)"/><text stroke="#08130f" stroke-width="7" paint-order="stroke" x="587.5" y="947" font-size="19" font-weight="600" fill="#eee7d4" text-anchor="middle">Answer spoken back on the call</text><text x="1330" y="1010" font-size="18" font-weight="500" fill="#9fb3a8" text-anchor="middle">Dashboard shows the "On Call" pill and a 5:00 timer</text><rect x="60" y="1060" width="1680" height="70" rx="20" fill="none" stroke="#d2a860" stroke-width="1.5" stroke-dasharray="9 8"/><text x="900" y="1103" text-anchor="middle" font-size="21" fill="#dcd5c0">Limits we design around: 5-minute calls · one call per line · greet within 10 s of bridge_ready · camera saved only when the caller asks</text><text x="1740" y="1172" text-anchor="end" font-size="20" fill="#9fb3a8">Cortex · HackUTA 2026 · one memory, many channels, every answer with proof</text></svg>