<text x="60" y="78" font-size="44" font-weight="700" fill="#eee7d4">Cortex over FaceTime</text>
<text x="60" y="118" font-size="24" fill="#9fb3a8">Same brain, new channel: a call sees the caller's camera, answers from memory and can send the follow-up.</text>
