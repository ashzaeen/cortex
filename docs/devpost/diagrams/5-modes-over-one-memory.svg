<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="glow" cx="20%" cy="0%" r="90%"><stop offset="0" stop-color="#1f5a48" stop-opacity=".55"/><stop offset="1" stop-color="#08130f" stop-opacity="0"/></radialGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2a860"/></marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3a8"/></marker>
</defs>
<rect width="1800" height="1200" fill="#08130f"/><rect width="1800" height="1200" fill="url(#glow)"/>
<text x="60" y="78" font-size="44" font-weight="700" fill="#eee7d4">One memory, four modes</text>
<text x="60" y="118" font-size="24" fill="#9fb3a8">A mode is a preset over the same memory: what it captures, when it speaks, what it proposes.</text>
<line x1="60" y1="140" x2="1740" y2="140" stroke="#d2a860" stroke-opacity=".5"/>
<rect x="60" y="265" width="560" height="235" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="84" y="317" font-size="32" font-weight="700" fill="#e4c382">Focus</text><text x="84" y="365" font-size="20" fill="#dcd5c0">Captures: meetings, decisions, whiteboards</text><text x="84" y="401" font-size="20" fill="#dcd5c0">Proposes: tasks, follow-up emails, calendar</text><text x="84" y="437" font-size="20" fill="#dcd5c0">Signature: "What did I promise Sam?"</text><rect x="1180" y="265" width="560" height="235" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="1204" y="317" font-size="32" font-weight="700" fill="#e4c382">Student</text><text x="1204" y="365" font-size="20" fill="#dcd5c0">Captures: lectures, slides, problem sets</text><text x="1204" y="401" font-size="20" fill="#dcd5c0">Proposes: flashcards, study blocks, notes</text><text x="1204" y="437" font-size="20" fill="#dcd5c0">Signature: deadline catcher, look-and-tutor</text><rect x="60" y="880" width="560" height="235" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="84" y="932" font-size="32" font-weight="700" fill="#e4c382">Life</text><text x="84" y="980" font-size="20" fill="#dcd5c0">Captures: objects, places, errands, receipts</text><text x="84" y="1016" font-size="20" fill="#dcd5c0">Proposes: reminders, expenses, messages</text><text x="84" y="1052" font-size="20" fill="#dcd5c0">Signature: "Where did I leave my keys?"</text><rect x="1180" y="880" width="560" height="235" rx="22" fill="#0e201a" stroke="rgba(238,231,212,0.22)" stroke-width="1.5"/><text x="1204" y="932" font-size="32" font-weight="700" fill="#e4c382">Assist</text><text x="1204" y="980" font-size="20" fill="#dcd5c0">Captures: scene, printed text, routine</text><text x="1204" y="1016" font-size="20" fill="#dcd5c0">Proposes: read aloud, reminders, caregiver note</text><text x="1204" y="1052" font-size="20" fill="#dcd5c0">Signature: sign reading, object finder</text><circle cx="900" cy="690" r="215" fill="#12372e" fill-opacity=".7" stroke="#d2a860" stroke-width="3"/><circle cx="900" cy="690" r="245" fill="none" stroke="#d2a860" stroke-opacity=".3" stroke-width="2"/><text x="900" y="630" text-anchor="middle" font-size="40" font-weight="700" fill="#e4c382">One shared</text><text x="900" y="676" text-anchor="middle" font-size="40" font-weight="700" fill="#e4c382">memory</text><text x="900" y="730" text-anchor="middle" font-size="22" fill="#dcd5c0">moments · people · promises</text><text x="900" y="762" text-anchor="middle" font-size="22" fill="#dcd5c0">actions · receipts</text><text x="900" y="794" text-anchor="middle" font-size="22" fill="#dcd5c0">sight, sound, call, time</text><path d="M620 470 L722 560" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M1180 470 L1078 560" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M620 905 L722 820" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M1180 905 L1078 820" fill="none" stroke="#d2a860" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="900" y="190" font-size="22" font-weight="600" fill="#dcd5c0" text-anchor="middle">Search crosses modes: a promise made in Focus is found from Life.</text><text x="900" y="224" font-size="22" font-weight="500" fill="#dcd5c0" text-anchor="middle">Switch by voice, in the app, or from a suggestion. Never silently.</text><text x="900" y="982" font-size="22" font-weight="700" fill="#e4c382" text-anchor="middle">Every mode keeps four guarantees:</text><text x="900" y="1016" font-size="21" font-weight="500" fill="#dcd5c0" text-anchor="middle">a visible capture state</text><text x="900" y="1045" font-size="21" font-weight="500" fill="#dcd5c0" text-anchor="middle">a forget command</text><text x="900" y="1074" font-size="21" font-weight="500" fill="#dcd5c0" text-anchor="middle">a proof link on every answer</text><text x="900" y="1103" font-size="21" font-weight="500" fill="#dcd5c0" text-anchor="middle">a yes before anything leaves the device</text><text x="1740" y="1172" text-anchor="end" font-size="20" fill="#9fb3a8">Cortex · HackUTA 2026 · one memory, many channels, every answer with proof</text></svg>