# Contract lint config. Recommended rules, minus the ones that do not fit a local hackathon API.
extends:
  - recommended
rules:
  security-defined: off          # auth is out of scope for the demo; add it through the contract-change process if needed
  no-server-example.com: off     # localhost servers are intentional (mock and local backend)
  info-license: off
  tag-description: off
  operation-4xx-response: off
  no-unused-components: off      # Event documents the SSE payload carried as text
